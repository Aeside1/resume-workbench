services:
  db-temp:
    image: postgres:16-alpine
    container_name: resume-temp-db
    environment:
      POSTGRES_DB: resume_workbench_temp
      POSTGRES_USER: resume_temp
      POSTGRES_PASSWORD: resume_temp_password
    ports: ["5433:5432"]
    volumes: ["postgres_temp_data:/var/lib/postgresql/data"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U resume_temp -d resume_workbench_temp"]
      interval: 3s
      timeout: 3s
      retries: 10
  api-temp:
    build:
      context: ./backend
    container_name: resume-temp-api
    environment:
      ENVIRONMENT: development
      DATABASE_URL: postgresql+psycopg://resume_temp:resume_temp_password@db-temp:5432/resume_workbench_temp
      TEST_DATABASE_URL: postgresql+psycopg://resume_temp:resume_temp_password@db-temp:5432/resume_workbench_temp
      SECRET_KEY: temp-secret-key-for-preview
    ports: ["8080:8000"]
    depends_on:
      db-temp:
        condition: service_healthy
  web-temp:
    build:
      context: ./frontend
      args:
        VITE_API_URL: http://localhost:8080
    container_name: resume-temp-web
    ports: ["5180:80"]
    depends_on: [api-temp]
volumes:
  postgres_temp_data:
