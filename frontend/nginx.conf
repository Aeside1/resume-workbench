# 前端镜像的 nginx 配置（替换 nginx 默认站点），让同一个镜像同时支持两种部署模式：
#
#   跨源模式（默认，直接用 IP 部署）：前端与 API 各占一个端口，
#     VITE_API_URL=http://<公网IP>:8000，浏览器直连 API，下面的 /api/ 反代不被走到。
#   同源模式（有域名 / 要 HTTPS 时）：VITE_API_URL=<页面自身来源>，
#     浏览器请求同源的 /api/*，由下面的 location /api/ 转发到 compose 网络内的 api 服务，
#     免去 CORS，也便于在外层统一终止 TLS。
#
# 注意：/api/ 这一段的 upstream 主机名是 compose 服务名，脱离 compose 网络单独运行该镜像时不可用。

server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # 构建产物文件名带内容哈希，可长期缓存；index.html 引用这些文件，因此不能缓存。
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    location = /index.html {
        add_header Cache-Control "no-cache";
    }

    location / {
        try_files $uri $uri/ /index.html;
    }

    location /api/ {
        # 用变量式 proxy_pass 延迟到请求时解析，避免 api 容器尚未就绪时 nginx 启动失败。
        # 127.0.0.11 是 Docker 的内嵌 DNS。
        resolver 127.0.0.11 valid=10s;
        set $api_upstream http://api:8000;
        proxy_pass $api_upstream;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    gzip on;
    gzip_min_length 1024;
    gzip_types text/css application/javascript application/json image/svg+xml;
}
