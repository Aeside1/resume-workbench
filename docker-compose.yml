services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: resume_workbench
      POSTGRES_USER: resume
      POSTGRES_PASSWORD: resume_dev_password
    ports: ["5432:5432"]
    volumes: ["postgres_data:/var/lib/postgresql/data"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U resume -d resume_workbench"]
      interval: 5s
      timeout: 5s
      retries: 10
  api:
    build: ./backend
    environment:
      ENVIRONMENT: development
      DATABASE_URL: postgresql+psycopg://resume:resume_dev_password@db:5432/resume_workbench
      SECRET_KEY: local-compose-secret-change-me
    ports: ["8000:8000"]
    depends_on:
      db:
        condition: service_healthy
  web:
    build: ./frontend
    ports: ["5173:80"]
    depends_on: [api]
volumes:
  postgres_data:
